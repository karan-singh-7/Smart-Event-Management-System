spring.application.name=API-Gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=health, info, matrics

# routes configuration
# ===========================

#Customer Service
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=path=/customers/**

#Event Service
spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=path=/events/**
